{% extends "layout.html" %}

{% block content %}
<h1 class="text-white main-color">お知らせ<div><h3>店舗からの最新情報</h3></div></h1>
<div class="text-center">
	<form action="/info">

		<div class="btn-group p-3 mx-2 rounded-6">
			<button type="submit" name = "is_read" value="all" class="btn btn-dark">すべて</button>
			<button type="submit"  name = "is_read" value="0" class="btn btn-dark">未読({{ unread_count }})</button>
			<button type="submit"  name = "is_read" value="1" class="btn btn-dark">既読</button> 
		</div>
	</form>
</div>

<div class="text-center">
	 {% for notification in notifications %}                   
	<li>
		<form action="/info/read/{{notification.id}}" method="post" class="card my-2 mx-4 text-decoration-none text-reset">
			<button class="card-body"type="submit">

				{% if notification.is_read == 0 %}
					📩
				{% else %}
					✔️
				{% endif %}

				{% if notification.type == "campaign" %}
					🎁<span class="badge text-bg-warning my-2 ">キャンペーン</span>
				{% elif notification.type == "reminder" %}
					🔔<span class="badge text-bg-light my-2 ">お知らせ</span>
				{% elif notification.type == "system" %}
					🔧<span class="badge text-bg-primary my-2 ">システム通知</span>
				{% else %}
					<span class="badge text-bg-secondary my-2 ">その他</span>
				{% endif %}

				
				
				<span class="badge text-bg-primary my-2 ">{{ notification.delivered_at.strftime('%m月%d日') }}</span>
				<h6 class="card-subtitle mb-2 text-body-secondary">{{ notification.title }}</h6>
				<p>{{delivered_at}}</p>
				<p class="card-text">{{ notification.body }}</p>
				<p class="card-text">{{ notification.salon.name }}</p>
			</button>
		</form>
	</li>

	 {% endfor %}
</div>


  
{% endblock %}
